# Local development only: internal MongoDB replica set, no public DB/broker ports.
x-backend: &backend
  build: .
  env_file: .env
  environment:
    MONGODB_URI: mongodb://mongodb:27017/?replicaSet=trivia-rs
    MONGODB_DATABASE: ${MONGODB_DATABASE:-trivia}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CACHE_REDIS_URL: redis://redis:6379/2
  volumes:
    - private_media:/app/private_media
    - staticfiles:/app/staticfiles
  depends_on:
    mongo-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
services:
  mongodb:
    image: mongo:8.0
    command: [mongod, --replSet, trivia-rs, --bind_ip_all]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)']
      interval: 5s
      retries: 30
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: [mongosh, --host, 'mongodb:27017', --quiet, --eval]
    command:
      - >-
        try { rs.status(); } catch(e) {
          if (e.code !== 94) throw e;
          rs.initiate({_id:'trivia-rs',members:[{_id:0,host:'mongodb:27017'}]});
        }
        for (let i=0;i<60;i++) {
          if (db.hello().isWritablePrimary) quit(0);
          sleep(1000);
        }
        quit(1);
    restart: 'no'
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
  migrate:
    <<: *backend
    command: [python, manage.py, migrate, --noinput]
    restart: 'no'
  api:
    <<: *backend
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 15s
      retries: 5
  worker:
    <<: *backend
    command: [celery, -A, rideflow, worker, --loglevel=INFO]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'celery -A rideflow inspect ping --timeout 3']
      interval: 30s
      retries: 3
  beat:
    <<: *backend
    command: [celery, -A, rideflow, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  mongodb_data:
  redis_data:
  private_media:
  staticfiles:
