<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;background:#f8faf9;color:#171717;font-family:Arial,sans-serif">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr><td align="center" style="padding:20px 12px">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff">
        <tr><td align="center" style="padding:24px 20px 8px">
          <img src="cid:{{ logo_cid }}" alt="Trivia" width="64" height="64" style="display:block;border:0">
          <h1 style="font-size:23px;color:#047857;margin:16px 0 0">{{ subject }}</h1>
        </td></tr>
        <tr><td style="padding:12px 24px 22px;line-height:1.5">
          <p>Enter this code in Trivia to {{ action }}.</p>
          <p style="background:#ecfdf5;color:#047857;font-size:30px;font-weight:bold;letter-spacing:5px;text-align:center;margin:18px 0;padding:12px 0">{{ code }}</p>
          <p>The code expires in <strong>5 minutes</strong> and can only be used once.</p>
          <p>Never share this code. If you did not request it, you can ignore this email.</p>
        </td></tr>
        <tr><td align="center" style="border-top:1px solid #e5e7eb;padding:18px 16px;color:#666666;font-size:13px;line-height:1.5">
          Trivia — Connected Mobility in Zimbabwe<br>
          Developed by MOrdec Solutions (Private) Limited
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
