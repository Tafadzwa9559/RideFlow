name: rideflow_mobile
description: Trivia — Your Journey. Your Choice. By MOrdec Solutions.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  intl: ^0.20.3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  web_socket_channel: ^3.0.3
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
